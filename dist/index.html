<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#181125">
<meta name="description" content="雾隐汤屋 · 像素动物温泉经营游戏">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>雾隐汤屋 · 像素动物温泉物语</title>
<style>
/* ==================== 基础 ==================== */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#100c1c}
body{
  font-family:'YouYuan','幼圆','Yuanti SC','ZCOOL KuaiLe','Microsoft YaHei',sans-serif;
  color:#f4e7c8;-webkit-font-smoothing:none;user-select:none;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
:root{
  --wood:#7a4a2b; --wood-d:#57301a; --wood-l:#a06a3a;
  --cream:#f4e7c8; --cream-d:#d8c49a;
  --gold:#ffd45e; --gold-d:#c9962e;
  --jade:#5ad0a6; --ink:#221610;
  --paper:#fff6e0; --night:#1c1430;
  --rose:#ff8ba7; --sky:#8fd3ff;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}

/* ==================== 像素面板通用 ==================== */
.panel{
  background:linear-gradient(180deg,#8a5633,#6d3f22);
  box-shadow:0 0 0 2px #2a170c,0 0 0 4px #a97a4a,0 4px 0 4px rgba(0,0,0,.35);
  border-radius:2px;
}
.panel-inner{background:#3a2415;box-shadow:inset 0 0 0 2px #241207;border-radius:2px}
.chip{
  display:flex;align-items:center;gap:5px;padding:3px 8px;font-size:13px;line-height:1;
  background:linear-gradient(180deg,#4a2f1a,#3a2415);
  box-shadow:0 0 0 2px #241207,inset 0 1px 0 rgba(255,220,160,.25);
  border-radius:2px;white-space:nowrap;
}
.chip canvas{flex:0 0 auto}
.chip b{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.chip .dim{color:#b99c72;font-size:11px}

/* ==================== 应用布局 ==================== */
#app{position:absolute;inset:0;display:flex;flex-direction:column;background:
  radial-gradient(120% 90% at 50% 0%,#241a3a 0%,#181125 55%,#100c1c 100%)}
body.portrait #app{transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}

#topbar{height:44px;flex:0 0 44px;display:flex;align-items:center;gap:6px;padding:0 8px;
  padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right));
  background:linear-gradient(180deg,#5d3820,#4a2c17);box-shadow:0 2px 0 #2a170c,0 4px 0 rgba(0,0,0,.3);z-index:20}
#topbar .grow{flex:1}
#shopName{font-size:14px;letter-spacing:2px;color:var(--cream);text-shadow:1px 1px 0 #00000080}
#starsRow{color:var(--gold);font-size:12px;letter-spacing:1px;text-shadow:1px 1px 0 #000}

#stage{flex:1;position:relative;overflow:hidden}
#game{position:absolute;background:#0e0a18;box-shadow:0 0 0 2px #2a170c,0 0 0 4px #6d4527,0 0 24px rgba(0,0,0,.6);touch-action:none}
#fx{position:absolute;inset:0;pointer-events:none;z-index:8}
@media (max-height:430px){
 #topbar{height:36px;flex-basis:36px;gap:4px;padding:0 5px}
 #bottombar{height:50px;flex-basis:50px;gap:4px;padding:0 5px}
 .pbtn{padding:5px 8px;font-size:12px}
 .pbtn.big{padding:8px 16px;font-size:14px}
 .chip{font-size:11px;padding:2px 6px}
 #shopName{font-size:12px;letter-spacing:1px}
 .tab{padding:5px 7px;font-size:11px}
}

#bottombar{height:60px;flex:0 0 60px;display:flex;align-items:center;gap:6px;padding:0 8px;
  padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right));
  background:linear-gradient(0deg,#5d3820,#4a2c17);box-shadow:0 -2px 0 #2a170c,0 -4px 0 rgba(0,0,0,.3);z-index:20}
@media (pointer:coarse){
 .pbtn{padding:8px 12px;min-height:34px}
 .pbtn.mini{padding:6px 9px;min-height:28px}
 .tab{padding:8px 10px}
 .dlg-close{width:32px;height:32px}
}
#roomTabs{display:flex;gap:5px;flex:1;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#roomTabs::-webkit-scrollbar{display:none}

/* ==================== 像素按钮 ==================== */
.pbtn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  padding:6px 10px;font-size:13px;color:var(--cream);letter-spacing:1px;border-radius:2px;
  background:linear-gradient(180deg,#a97a4a,#7a4a2b);
  box-shadow:0 0 0 2px #241207,inset 0 1px 0 rgba(255,230,180,.4),0 2px 0 2px rgba(0,0,0,.4);
  text-shadow:1px 1px 0 #00000070;transition:filter .08s;flex:0 0 auto;
}
.pbtn:hover{filter:brightness(1.12)}
.pbtn:active{transform:translateY(1px);filter:brightness(.92)}
.pbtn.gold{background:linear-gradient(180deg,#ffd45e,#d8a032);color:#4a2c07;text-shadow:none}
.pbtn.jade{background:linear-gradient(180deg,#5ad0a6,#2e9a74);color:#0c2a1e;text-shadow:none}
.pbtn.rose{background:linear-gradient(180deg,#ff8ba7,#d05a78);color:#3a0c18;text-shadow:none}
.pbtn.ghost{background:#3a2415;color:#d8c49a}
.pbtn.mini{padding:3px 7px;font-size:11px}
.pbtn.big{padding:10px 22px;font-size:16px;letter-spacing:3px}
.pbtn[disabled]{opacity:.45;pointer-events:none}
.tab{padding:6px 9px;font-size:12px;border-radius:2px;color:#c8a878;background:#33200f;
  box-shadow:0 0 0 2px #241207;letter-spacing:1px;flex:0 0 auto;display:flex;gap:4px;align-items:center}
.tab.on{background:linear-gradient(180deg,#a97a4a,#7a4a2b);color:var(--cream);box-shadow:0 0 0 2px #241207,inset 0 1px 0 rgba(255,230,180,.4)}
.tab.locked{opacity:.55}

/* ==================== 气泡 / 横幅 / 提示 ==================== */
.bubble{
  position:absolute;max-width:170px;padding:5px 8px;font-size:12px;line-height:1.35;color:var(--ink);
  background:var(--paper);box-shadow:0 0 0 2px #241207,2px 3px 0 2px rgba(0,0,0,.28);border-radius:2px;
  transform:translate(-50%,-100%);z-index:12;pointer-events:none;
  animation:bpop .18s ease-out;
}
.bubble::after{content:'';position:absolute;left:50%;bottom:-7px;margin-left:-4px;
  width:8px;height:7px;background:var(--paper);clip-path:polygon(0 0,100% 0,50% 100%)}
.bubble.gold{background:#ffe9a8;box-shadow:0 0 0 2px #6b4a00,0 0 12px rgba(255,212,94,.6)}
.bubble .who{color:#b05f2e;font-size:10px;display:block;margin-bottom:1px}
@keyframes bpop{from{transform:translate(-50%,-100%) scale(.6);opacity:0}}

#banner{position:absolute;top:10px;left:50%;transform:translateX(-50%) translateY(-60px);z-index:15;
  padding:8px 18px;font-size:15px;letter-spacing:2px;color:#4a2c07;pointer-events:none;opacity:0;
  background:linear-gradient(180deg,#ffe9a8,#ffd45e);box-shadow:0 0 0 2px #6b4a00,0 0 0 4px #ffd45e88,0 4px 0 4px rgba(0,0,0,.3);
  border-radius:2px;transition:transform .35s cubic-bezier(.2,1.4,.4,1),opacity .35s;text-align:center}
#banner.show{transform:translateX(-50%) translateY(0);opacity:1}
#banner small{display:block;font-size:11px;color:#8a5f1a;letter-spacing:1px}

#toasts{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;z-index:16;pointer-events:none}
.toast{padding:5px 10px;font-size:12px;background:#241207e6;color:var(--cream);
  box-shadow:0 0 0 2px #6d4527;border-radius:2px;animation:tin .25s ease-out;letter-spacing:1px}
.toast.gold{color:var(--gold)} .toast.jade{color:var(--jade)} .toast.rose{color:var(--rose)}
@keyframes tin{from{transform:translateX(40px);opacity:0}}

/* ==================== 弹窗 ==================== */
#modalRoot{position:fixed;inset:0;z-index:100;pointer-events:none}
.mask{position:absolute;inset:0;background:rgba(8,5,16,.72);pointer-events:auto;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.dlg{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,96vw);
  max-height:88%;display:flex;flex-direction:column;padding:12px;z-index:5;pointer-events:auto;
  animation:dpop .22s cubic-bezier(.2,1.4,.4,1);
}
@keyframes dpop{from{transform:translate(-50%,-50%) scale(.85);opacity:0}}
.dlg-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dlg-title{font-size:16px;letter-spacing:3px;color:var(--gold);text-shadow:1px 1px 0 #000;flex:1}
.dlg-close{width:28px;height:28px;font-size:14px;color:var(--cream);background:#3a2415;
  box-shadow:0 0 0 2px #241207;border-radius:2px}
.dlg-body{overflow-y:auto;padding:10px;flex:1;font-size:14px;line-height:1.6;scrollbar-width:thin;scrollbar-color:#7a4a2b #241207}
.dlg-body::-webkit-scrollbar{width:8px}
.dlg-body::-webkit-scrollbar-thumb{background:#7a4a2b}
.dlg-body::-webkit-scrollbar-track{background:#241207}
.dlg-foot{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding-top:8px}

/* ==================== 列表条目 ==================== */
.row{display:flex;align-items:center;gap:8px;padding:7px 8px;margin-bottom:6px;border-radius:2px;
  background:#2c1a0d;box-shadow:inset 0 0 0 1px #1d0f05}
.row canvas{flex:0 0 auto}
.row .info{flex:1;min-width:0}
.row .name{font-size:13px;color:var(--cream);letter-spacing:1px}
.row .sub{font-size:11px;color:#b99c72;margin-top:2px;line-height:1.4}
.row .tag{display:inline-block;padding:1px 5px;font-size:10px;margin-right:3px;border-radius:2px;
  background:#4a2f1a;color:#e8c88a;box-shadow:0 0 0 1px #241207}
.row .tag.like{background:#1e4436;color:#7fe8c0}
.row .tag.dis{background:#4a1e28;color:#ff9ab0}
.bar{height:6px;background:#1d0f05;box-shadow:inset 0 0 0 1px #000;margin-top:3px;border-radius:1px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#5ad0a6,#ffd45e)}

/* ==================== 开场 ==================== */
#intro{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;background:radial-gradient(120% 100% at 50% 0%,#2c1f4e 0%,#181125 55%,#0d0917 100%);transition:opacity .5s}
#intro.off{opacity:0;pointer-events:none}
#introLogo{image-rendering:pixelated}
#introTitle{font-size:30px;letter-spacing:10px;color:var(--gold);text-shadow:2px 2px 0 #6b4a00,4px 4px 0 #000}
#introSub{font-size:13px;letter-spacing:4px;color:#b99c72}
#introBtns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
#introHelp{font-size:11px;color:#8a745a;letter-spacing:1px;text-align:center;line-height:1.8;max-width:420px}
.star-dot{position:absolute;width:2px;height:2px;background:#ffe9a8;border-radius:0;animation:twk 2.4s infinite}
@keyframes twk{0%,100%{opacity:.15}50%{opacity:.9}}

/* ==================== 布局编辑器 ==================== */
body.editing .chip.drag{outline:2px dashed var(--gold);cursor:move}
#editBar{position:absolute;top:48px;left:50%;transform:translateX(-50%);z-index:40;display:none;gap:6px}
body.editing #editBar{display:flex}

/* ==================== 杂项 ==================== */
.hr{height:2px;background:#241207;box-shadow:0 1px 0 rgba(255,220,160,.15);margin:8px 0}
.kv{display:flex;justify-content:space-between;font-size:12px;color:#d8c49a;padding:2px 0}
.kv b{color:var(--gold)}
.center{text-align:center}
.mut{color:#b99c72;font-size:11px}
.glow{animation:glowp 1.2s infinite alternate}
@keyframes glowp{from{filter:brightness(1)}to{filter:brightness(1.35)}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:90}
.shake{animation:shk .3s}
@keyframes shk{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,1px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,2px)}}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="chip drag" id="chipShop"><span id="shopName">雾隐汤屋</span><span id="starsRow"></span></div>
    <div class="chip drag" id="chipClock"><canvas id="clockCv" width="22" height="22"></canvas><span id="periodTx">清晨</span><span class="dim" id="dayTx">第1天</span></div>
    <div class="chip" id="chipWeather"><canvas id="weatherCv" width="14" height="14"></canvas><span id="weatherTx">晴</span></div>
    <div class="grow"></div>
    <div class="chip drag" id="chipWallet"><canvas id="coinCv" width="13" height="13"></canvas><b id="coinTx">0</b></div>
    <div class="chip" id="chipGem"><canvas id="gemCv" width="13" height="13"></canvas><b id="gemTx">0</b></div>
    <button class="pbtn mini" id="btnSpeed" title="速度">×1</button>
    <button class="pbtn mini" id="btnPause" title="暂停">⏸</button>
    <button class="pbtn mini" id="btnSound" title="声音">♪</button>
  </header>

  <div id="stage">
    <canvas id="game" width="512" height="288"></canvas>
    <div id="fx"></div>
    <div id="banner"></div>
    <div id="toasts"></div>
  </div>

  <div id="editBar">
    <button class="pbtn mini gold" id="btnEditSave">保存排版</button>
    <button class="pbtn mini" id="btnEditReset">重置</button>
    <button class="pbtn mini" id="btnEditExport">导出</button>
    <button class="pbtn mini ghost" id="btnEditDone">完成</button>
  </div>

  <footer id="bottombar">
    <div id="roomTabs"></div>
    <button class="pbtn" id="btnBuild">建造</button>
    <button class="pbtn" id="btnStaff">员工</button>
    <button class="pbtn" id="btnDex">图鉴</button>
    <button class="pbtn gold" id="btnLevel">关卡</button>
  </footer>
</div>

<div id="modalRoot"></div>
<div id="flash"></div>

<div id="intro">
  <canvas id="introLogo" width="72" height="52"></canvas>
  <div id="introTitle">雾隐汤屋</div>
  <div id="introSub">像素动物温泉经营物语</div>
  <div id="introBtns">
    <button class="pbtn gold big" id="btnFree">自由经营</button>
    <button class="pbtn jade big" id="btnStage">关卡模式</button>
  </div>
  <div id="introHelp">
    经营五间汤屋 · 招待十六种动物客人<br>
    泡汤契合度 / 今日心愿 / 离店点评 决定你的声望<br>
    点击客人闲聊 · 点击汤池升级 · 小心口碑见底会倒闭哦
  </div>
</div>

<script>
'use strict';
/* ============================================================
   雾隐汤屋 · 像素动物温泉经营游戏  V 1.4.0
   单文件 · 原生 JS · 程序化像素美术 · 无依赖
============================================================ */
const GAME_VERSION='1.4.0', CACHE_NAME='tangwu-cache-v1';

/* ---------------- 小工具 ---------------- */
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const d=document.createElement(t);if(c)d.className=c;if(h!=null)d.innerHTML=h;return d;};
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
const fmt=n=>n>=100000?(n/1000|0)+'k':''+Math.round(n);
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);
function bake(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;fn(g,w,h);return c;}
function px(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(x|0,y|0,w,h);}

/* ---------------- 逻辑分辨率 ---------------- */
const W=512,H=288,TILE=16,GW=32,GH=18;
const WALL_H=3;               // 顶部墙带（格）
const DAY_SECONDS=210;        // 一天真实秒数
const PERIODS=[
 {id:'dawn',name:'清晨',from:5 ,to:7 ,light:.25,income:1.0},
 {id:'morn',name:'上午',from:7 ,to:10,light:0  ,income:1.0},
 {id:'noon',name:'正午',from:10,to:13,light:0  ,income:1.0},
 {id:'aftn',name:'午后',from:13,to:16,light:.06,income:1.0},
 {id:'dusk',name:'黄昏',from:16,to:19,light:.22,income:1.2},
 {id:'nite',name:'夜晚',from:19,to:23,light:.5 ,income:1.5},
 {id:'late',name:'深夜',from:23,to:29,light:.62,income:1.6},
];
function periodAt(hour){hour=((hour%24)+24)%24;for(const p of PERIODS){const h2=hour<p.from?hour+24:hour;if(h2>=p.from&&h2<p.to)return p;}return PERIODS[1];}

/* ---------------- 动物数据 ---------------- */
/* likes: 偏好汤种（契合+）  dislike: 讨厌（契合-）
   ear: round|point|long|antler|none   tail: stub|curl|fluffy|flat|fin */
const SPECIES={

   names:['墩墩','慢郎','柚柚子','石石','温泉守']},

   names:['花卷','琥珀','三三','团子','墨墨']},
 shib:{name:'柴犬',  ear:'point', tail:'curl', size:1.0,  body:'#e0913f',belly:'#fff2dd',dark:'#8a4f16',likes:['cyber','milk'],dislike:'moon',pay:12,perso:'元气自来熟',
   names:['旺财','豆豆','大福','丸子','阿柴']},
 foxe:{name:'狐狸',  ear:'point', tail:'fluffy',size:1.0, body:'#e86f3a',belly:'#ffe8d2',dark:'#8a3a16',likes:['moon','yuzu'],dislike:'sand',pay:14,perso:'神秘夜行者',
   names:['绀叶','小狐','琥珀丸','夕雾','铃音']},
 racc:{name:'浣熊',  ear:'round', tail:'fluffy',size:.98, body:'#8a8a92',belly:'#e8e4dc',dark:'#3a3a44',mask:true,likes:['herb','hot'],dislike:'milk',pay:11,perso:'搓洗强迫症',
   names:['搓搓','小浣','灰灰','桶桶','夜宵']},
 bear:{name:'棕熊',  ear:'round', tail:'stub', size:1.32, body:'#8a5a30',belly:'#d8a86a',dark:'#4e2f14',likes:['hot','ice'],dislike:'moon',pay:18,perso:'憨厚大胃王',
   names:['熊岳','蜜蜜','大山','圆滚','掌掌']},
 peng:{name:'企鹅',  ear:'none',  tail:'fin',  size:.95,  body:'#3a4a5e',belly:'#f4f8ff',dark:'#222c38',beak:'#ffab3a',likes:['ice','cyber'],dislike:'hot',pay:13,perso:'怕热冒险家',
   names:['浮冰','摇摇','南极客','小翼','冰冰']},
 duck:{name:'小鸭',  ear:'none',  tail:'flat', size:.85,  body:'#ffd94a',belly:'#fff3b8',dark:'#b8922a',beak:'#ff8c3a',likes:['yuzu','hot'],dislike:'sand',pay:9,perso:'嘎嘎气氛组',
   names:['嘎嘎','布丁','小黄','涟漪','扁扁']},
 ottr:{name:'水獭',  ear:'round', tail:'flat', size:1.0,  body:'#7a5a42',belly:'#e8d2b4',dark:'#463020',likes:['cyber','hot','stone'],dislike:'sand',pay:13,perso:'手拉手睡派',
   names:['漂漂','贝壳','小捞','转转','海藻']},

/* ---------------- 像素美术：动物烘焙 ---------------- */
function blobRows(cx,cy,rx,ry){const rows=[];for(let y=-ry;y<=ry;y++){const f=Math.sqrt(Math.max(0,1-(y*y)/(ry*ry)));const hw=Math.max(1,Math.round(rx*f));rows.push([cy+y,cx-hw,cx+hw]);}return rows;}
function drawBlob(g,cx,cy,rx,ry,color){for(const[y,x0,x1]of blobRows(cx,cy,rx,ry))px(g,x0,y,x1-x0+1,1,color);}

function bakeAnimal(sp,vip){
 const S=20;
 return bake(S,S,g=>{
  const C=10,topY=11;
  // 尾巴（先画在身后）
  if(sp.tail==='fluffy'){drawBlob(g,3,topY-2,3,3,sp.dark);drawBlob(g,2,topY-3,2,2,'#fff6e8');
   if(sp.ring){px(g,1,topY-4,3,1,sp.dark);px(g,2,topY-1,3,1,sp.dark);}}
  else if(sp.tail==='curl'){px(g,3,topY-1,2,2,sp.dark);px(g,2,topY-2,2,2,sp.body);}
  else if(sp.tail==='flat'){px(g,3,topY,3,2,sp.dark);}
  else if(sp.tail==='fin'){px(g,3,topY-2,2,4,sp.dark);}
  else if(sp.tail==='stub'){px(g,3,topY,2,2,sp.dark);}
  // 轮廓 + 身体
  drawBlob(g,C,topY-1,7,7,sp.dark);
  drawBlob(g,C,topY-1,6,6,sp.body);
  // 肚皮
  drawBlob(g,C,topY+2,4,3,sp.belly);
  // 斑点（小鹿）
  if(sp.spots){px(g,6,topY-4,1,1,'#fff6e8');px(g,13,topY-3,1,1,'#fff6e8');px(g,9,topY-6,1,1,'#fff6e8');}
  // 三花猫色块
  if(sp.patch){drawBlob(g,6,topY-5,2,2,sp.patch);drawBlob(g,14,topY-4,2,2,'#e8e4dc');}
  // 奶牛花斑
  if(sp.spots2){drawBlob(g,7,topY-3,2,2,sp.dark);drawBlob(g,13,topY-1,2,2,sp.dark);drawBlob(g,10,topY+3,2,1,sp.dark);}
  // 刺猬的刺冠
  if(sp.spikes){drawBlob(g,C,topY-5,6,2,sp.dark);
   for(let i=0;i<7;i++){px(g,C-6+i*2,topY-8-(i%2),1,3,sp.dark);}
   px(g,C-3,topY-9,1,2,sp.dark);px(g,C+2,topY-9,1,2,sp.dark);}
  // 小熊猫脸颊白斑
  if(sp.cheek){px(g,5,topY-4,2,2,'#fff6e8');px(g,13,topY-4,2,2,'#fff6e8');}
  // 耳朵
  if(sp.ear==='round'){drawBlob(g,5,topY-7,2,2,sp.body);drawBlob(g,15,topY-7,2,2,sp.body);px(g,5,topY-7,1,1,sp.dark);px(g,15,topY-7,1,1,sp.dark);}
  else if(sp.ear==='point'){px(g,4,topY-9,2,3,sp.dark);px(g,14,topY-9,2,3,sp.dark);px(g,4,topY-8,1,2,sp.body);px(g,15,topY-8,1,2,sp.body);}
  else if(sp.ear==='long'){px(g,6,topY-13,2,6,sp.dark);px(g,12,topY-13,2,6,sp.dark);px(g,6,topY-12,1,4,'#f4b8c8');px(g,13,topY-12,1,4,'#f4b8c8');}
  else if(sp.ear==='antler'){px(g,5,topY-10,1,3,sp.dark);px(g,4,topY-11,1,2,sp.dark);px(g,14,topY-10,1,3,sp.dark);px(g,15,topY-11,1,2,sp.dark);}
  // 牛角
  if(sp.horn){px(g,3,topY-9,2,2,'#e8d8b0');px(g,15,topY-9,2,2,'#e8d8b0');}
  // 喙
  if(sp.beak){px(g,9,topY-2,2,2,sp.beak);}
  // 浣熊面罩
  if(sp.mask){px(g,6,topY-3,3,2,'#2a2a32');px(g,11,topY-3,3,2,'#2a2a32');}
  // 海豹胡须
  if(sp.whisk){px(g,4,topY-2,2,1,'#ffffff');px(g,14,topY-2,2,1,'#ffffff');}
  // 眼睛（泡澡闭眼另绘）
  px(g,7,topY-3,1,2,'#221610');px(g,12,topY-3,1,2,'#221610');
  // 腮红
  px(g,5,topY-1,1,1,'#ff9aa8');px(g,14,topY-1,1,1,'#ff9aa8');
  // 脚
  px(g,7,topY+6,2,2,sp.dark);px(g,11,topY+6,2,2,sp.dark);
  // VIP 金冠
  if(vip){px(g,8,topY-10,4,1,'#ffd45e');px(g,8,topY-12,1,2,'#ffd45e');px(g,10,topY-13,1,3,'#ffd45e');px(g,11,topY-12,1,2,'#ffd45e');}
 });
}

const SND={ctx:null,on:true};
function sndInit(){if(!SND.ctx){try{SND.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}}
function beep(f=660,d=.07,type='square',vol=.05,slide=0){
 if(!SND.on||!SND.ctx)return;const c=SND.ctx;try{
 const o=c.createOscillator(),v=c.createGain();o.type=type;o.frequency.value=f;
 if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),c.currentTime+d);
 v.gain.value=vol;v.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);
 o.connect(v);v.connect(c.destination);o.start();o.stop(c.currentTime+d);}catch(e){}}

   }

   ellipseFill(g,cx,cy,rx-4,ry-4,f.water2);

   for(let i=0;i<8;i++){const a=R()*6.28,rr=R()*.6;g.fillRect(cx+Math.cos(a)*rx*rr,cy+Math.sin(a)*ry*rr,2+R()*3,1);}

   // 底部泡沫
   g.fillStyle='#ffffffcc';for(let x=cx-rx+7;x<cx+rx-7;x+=4)g.fillRect(x,cy+ry-7,2,1);
  }else if(f.shape==='diamond'){
   const cx=w/2,cy=h/2,rx=w/2-1,ry=h/2-1;
   // 菱形青石棱边
   const verts=[[cx,cy-ry],[cx+rx,cy],[cx,cy+ry],[cx-rx,cy]];
   for(let e=0;e<4;e++){
    const x1=verts[e][0],y1=verts[e][1],x2=verts[(e+1)%4][0],y2=verts[(e+1)%4][1];
    for(let i=0;i<1;i+=.13){
     const sx=x1+(x2-x1)*i,sy=y1+(y2-y1)*i;
     const t=R();const col=t<.33?'#b8b2a4':(t<.66?'#d8d2c2':'#8f8a7a');

   // 波纹与池心高光
   g.fillStyle='#ffffff50';
   for(let i=0;i<8;i++){const dx=(R()-.5)*rx*1.1,dy=(R()-.5)*ry*.7;g.fillRect(cx+dx,cy+dy,2+R()*3,1);}
   g.fillStyle='#ffffffcc';
   diamondFill(g,cx,cy+Math.max(2,ry-6),Math.max(3,rx*.35),1,'#ffffffcc');
  }else{

   for(let y=11;y<h-5;y+=6){g.fillRect(1,y-1,4,1);g.fillRect(w-5,y-1,4,1);}
   // 内水區
   const ix=5,iy=5,iw=w-10,ih=h-10;
   px(g,ix,iy,iw,ih,f.water2);
   px(g,ix,iy,iw,Math.max(3,ih*.55|0),f.water);
   g.fillStyle='#00000025';g.fillRect(ix,iy,iw,1);g.fillRect(ix,iy,1,ih);
   if(f.sand){

    g.fillStyle='#ffe9b055';for(let i=0;i<10;i++)g.fillRect(ix+2+R()*(iw-5),iy+2+R()*(ih-5),2,1);

   }
  }

 });

function ellipseFill(g,cx,cy,rx,ry,col){g.fillStyle=col;for(let y=Math.ceil(-ry);y<=ry;y++){const hw=Math.max(1,Math.round(rx*Math.sqrt(Math.max(0,1-(y*y)/(ry*ry)))));g.fillRect(cx-hw,cy+y,hw*2,1);}}
function diamondFill(g,cx,cy,rx,ry,col){g.fillStyle=col;for(let y=Math.ceil(-ry);y<=ry;y++){const hw=Math.max(1,Math.round(rx*(1-Math.abs(y)/ry)));g.fillRect(cx-hw,cy+y,hw*2,1);}}
function poolClip(f,X,Y,w,h){
 ctx.beginPath();
 if(f.shape==='round')ctx.ellipse(X+w/2,Y+h/2,w/2-4,h/2-4,0,0,7);
 else if(f.shape==='diamond'){ctx.moveTo(X+w/2,Y+4);ctx.lineTo(X+w-4,Y+h/2);ctx.lineTo(X+w/2,Y+h-4);ctx.lineTo(X+4,Y+h/2);ctx.closePath();}
 else ctx.rect(X+5,Y+5,w-10,h-10);
}

function makeActor(k){
 const a={k,room:'hall',x:0,y:0,dir:1,speed:30,state:'idle',tx:0,ty:0,
  mutterT:3+rnd(5),sweepT:0,tool:0,inst:0,instT:10,zzz:false};
 if(k==='clerk'){a.x=216;a.y=104;}
 else if(k==='clean'){a.x=120;a.y=150;a.state='walk';a.tx=160;a.ty=150;}
 else{a.x=196;a.y=166;}
 return a;
}
function spawnActors(){G.actors=[];for(const k in G.staff)if(G.staff[k])G.actors.push(makeActor(k));}
function staffBubble(a,txt){
 if(a.room!==G.curRoom||G.paused||!G.running)return;
 const fx=$('#fx');if(fx.querySelectorAll('.bubble').length>=3)return;
 const b=el('div','bubble',`<span class="who">${STAFF[a.k].name}</span>${txt}`);
 b.style.left=(a.x*SCALE)+'px';b.style.top=((a.y-26)*SCALE)+'px';
 fx.appendChild(b);
 setTimeout(()=>{b.style.transition='opacity .4s';b.style.opacity='0';setTimeout(()=>b.remove(),420);},3200);
}
function updateActors(dt){
 for(const a of G.actors){
  a.mutterT-=dt;
  if(a.k==='clerk'){
   if(a.mutterT<=0){a.mutterT=7+rnd(8);staffBubble(a,pick(STAFF.clerk.mutter));if(chance(.4))sparks(a.x+10,a.y-6,'#ffd45e',2);}
  }else if(a.k==='clean'){
   if(a.state==='walk'){
    if(moveTo(a,a.tx,a.ty,dt)){a.state='sweep';a.sweepT=5+rnd(5);}
   }else{
    a.sweepT-=dt;a.dir=Math.sin(G.t*2+a.x)>0?1:-1;
    if(chance(dt*2))sparks(a.x+rnd(-7,7),a.y+3,'#fff6e0',1);
    if(a.sweepT<=0){
     a.tool=(a.tool+1)%3;
     if(chance(.25)){
      const rooms=Object.keys(G.rooms).filter(r=>G.rooms[r].unlocked);
      a.room=pick(rooms);a.x=chance(.5)?-10:W+10;a.y=WALL_H*TILE+20+rnd(H-WALL_H*TILE-40);
     }
     a.tx=20+rnd(W-40);a.ty=WALL_H*TILE+16+rnd(H-WALL_H*TILE-30);a.state='walk';
    }
   }
   if(a.mutterT<=0){a.mutterT=12+rnd(10);staffBubble(a,pick(STAFF.clean.mutter));}
  }else{ // dj
   a.instT-=dt;
   if(a.instT<=0){a.instT=12+rnd(6);a.inst++;a.zzz=false;sparks(a.x+8,a.y-14,'#ffd45e',3);}
   const night=G.period.income>1;
   if(!night&&G.period.light===0&&chance(dt*.06))a.zzz=true;
   if(a.zzz){
    if(a.mutterT<=0){a.mutterT=9+rnd(6);staffBubble(a,'咕……白天就……小睡一下……');}
   }else{
    if(chance(dt*(night?1.4:.5)))SPARKS.push({x:a.x+8,y:a.y-12,vx:6+rnd(10),vy:-10-rnd(10),life:1.2,age:0,c:pick(['#ffd45e','#8fd3ff','#ff8ba7']),dt:0});
    if(a.mutterT<=0){a.mutterT=13+rnd(10);staffBubble(a,pick(STAFF.dj.mutter));}
   }
  }
 }
}

   ctx.fillStyle='#c84a3a';const bb=Math.floor(G.t*5)%3;
   ctx.fillRect(a.x+9+bb*2,a.y-5,1,1);ctx.fillRect(a.x+12-bb,a.y-2,1,1);
  }else if(a.k==='clean'){
   if(a.tool===0){ // 扫把
    px(ctx,a.x+7,a.y-12,1,13,'#8a5a2a');
    ctx.fillStyle='#d8c49a';ctx.fillRect(a.x+5,a.y+(Math.sin(G.t*9)>0?1:0),5,3);
   }else if(a.tool===1){ // 拖把
    px(ctx,a.x+7,a.y-12,1,13,'#8a5a2a');
    ctx.fillStyle='#e8f0f8';ctx.fillRect(a.x+5,a.y,5,4);
    ctx.fillStyle='rgba(159,216,239,.35)';ctx.fillRect(a.x-7,a.y+4,14,2);
   }else{ // 背清洁匣
    px(ctx,a.x-13,a.y-12,6,9,'#a97a4a');ctx.fillStyle='#57301a';ctx.fillRect(a.x-13,a.y-8,6,1);
    ctx.fillStyle='#ffd45e';ctx.fillRect(a.x-12,a.y-11,1,1);
   }
  }else{ // dj 乐器轮换
   const i=a.inst%3;
   if(!a.zzz){
    if(i===0){ctx.fillStyle='#a97a4a';ctx.fillRect(a.x+6,a.y-5,5,4);ctx.fillStyle='#57301a';ctx.fillRect(a.x+10,a.y-9,1,5);}
    else if(i===1){ctx.fillStyle='#ffd45e';ctx.fillRect(a.x+6,a.y-7,6,2);ctx.fillRect(a.x+11,a.y-9,2,4);}
    else{ctx.fillStyle='#c85a4a';ctx.fillRect(a.x+6,a.y-5,6,5);ctx.fillStyle='#fff6e0';ctx.fillRect(a.x+6,a.y-5,6,1);
     if(Math.sin(G.t*8)>0){ctx.fillStyle='#8a5a2a';ctx.fillRect(a.x+8,a.y-8,1,3);}}
   }
  }
  ctx.restore();
  if(a.k==='dj'&&a.zzz){ // zzz
   const zt=(G.t*4)%6;
   ctx.fillStyle='#8fd3ff';ctx.fillRect(a.x+8,y-2-zt,3,2);ctx.fillRect(a.x+11,y-5-zt,2,2);
  }
 }
}

/* ============================================================
   画布适配 · 整数缩放 · 竖屏整页旋转
============================================================ */
const cv=$('#game'),ctx=cv.getContext('2d');
let SCALE=1,ROTATED=false,CVX=0,CVY=0;
function fit(){
 const portrait=window.innerHeight>window.innerWidth;
 ROTATED=portrait;document.body.classList.toggle('portrait',portrait);
 const app=$('#app');
 if(portrait){app.style.width=window.innerHeight+'px';app.style.height=window.innerWidth+'px';}
 else{app.style.width='';app.style.height='';}
 // 等待布局
 requestAnimationFrame(()=>{
  const st=$('#stage'),sw=st.clientWidth,sh=st.clientHeight;
  let s=Math.min(sw/W,sh/H);
  SCALE=s>=1?Math.floor(s):Math.round(s*100)/100;
  cv.style.width=(W*SCALE)+'px';cv.style.height=(H*SCALE)+'px';
  CVX=(sw-W*SCALE)/2;CVY=(sh-H*SCALE)/2;
  cv.style.left=CVX+'px';cv.style.top=CVY+'px';
  const fx=$('#fx');fx.style.left=CVX+'px';fx.style.top=CVY+'px';fx.style.width=(W*SCALE)+'px';fx.style.height=(H*SCALE)+'px';
 });
}
window.addEventListener('resize',fit);
window.addEventListener('orientationchange',()=>setTimeout(fit,60));
function toWorld(cx,cy){
 const r=cv.getBoundingClientRect();
 if(ROTATED){const s=r.height/W;return{x:clamp((cy-r.top)/s,0,W),y:clamp(H-(cx-r.left)/s,0,H)};}
 const s=r.width/W;return{x:clamp((cx-r.left)/s,0,W),y:clamp((cy-r.top)/s,0,H)};
}

/* ============================================================
   放置系统
============================================================ */
let PLACING=null,GHOST={x:0,y:0,ok:false};
function placedOf(room){return G.rooms[room||G.curRoom].placed;}
function rectsHit(a,b){return !(a.x+a.w<=b.x||b.x+b.w<=a.x||a.y+a.h<=b.y||b.y+b.h<=a.y);}
function canPlace(id,tx,ty,ignore){
 const f=FACILITIES[id];if(!f)return false;
 if(f.wallOnly){if(ty<1||ty>WALL_H-1)return false;}
 else if(ty<WALL_H||ty+f.h>GH)return false;
 if(tx<0||tx+f.w>GW)return false;
 const box={x:tx,y:ty,w:f.w,h:f.h};
 for(const p of placedOf()){if(p!==ignore&&rectsHit(box,{x:p.x,y:p.y,w:FACILITIES[p.id].w,h:FACILITIES[p.id].h}))return false;}
 if(f.wallOnly){const n=placedOf().filter(p=>p.id==='lantern').length;if(n>=f.maxCount)return false;}
 return true;
}
function placeFac(id,tx,ty){
 const f=FACILITIES[id];
 if(G.coins<f.cost){toast('金币不够啦','#ff8ba7');SFX.bad();return false;}
 if(!canPlace(id,tx,ty)){toast('这里放不下哦','#ff8ba7');return false;}
 G.coins-=f.cost;
 placedOf().push({uid:'p'+(++G.uidc),id,x:tx,y:ty,level:1,daily:0});
 SFX.pop();toast(f.name+' 建好了','#5ad0a6');
 renderRoomTabs();checkLevelGoals();
 return true;
}
G.uidc=0;

/* ============================================================
   粒子：雾气 / 房间氛围 / 天气
============================================================ */
let STEAM=[],AMBIENT=[],WEATHERP=[],SPARKS=[];
function emitSteam(dt){
 for(const p of placedOf()){
  const f=FACILITIES[p.id];if(!f.steam)continue;
  if(chance(f.steam*dt*4)){
   let sx=p.x*TILE+6+rnd(f.w*TILE-12);
   if(f.shape==='diamond')sx=p.x*TILE+f.w*TILE/2+rnd(-f.w*TILE/4,f.w*TILE/4);
   else if(f.shape==='round')sx=p.x*TILE+f.w*TILE/2+rnd(-f.w*TILE/3,f.w*TILE/3);
   STEAM.push({x:sx,y:p.y*TILE+6,vy:-4-rnd(5),life:1.6+rnd(1.4),age:0,r:2+rnd(3)});
  }
 }
 for(let i=STEAM.length-1;i>=0;i--){const s=STEAM[i];s.age+=dt;s.y+=s.vy*dt;s.x+=Math.sin(G.t*2+s.y*.1)*6*dt;if(s.age>s.life)STEAM.splice(i,1);}
}
function emitAmbient(dt){
 const theme=ROOMS.find(r=>r.id===G.curRoom).theme;
 if(theme==='forest'&&chance(dt*3))AMBIENT.push({x:rnd(W),y:60+rnd(H-90),ph:rnd(6),vy:-2-rnd(3),life:4,age:0,k:'fly',c:'#d8ff8a'});
 if(theme==='snow'&&chance(dt*8))AMBIENT.push({x:rnd(W),y:-4,vy:12+rnd(10),vx:-3+rnd(6),life:30,age:0,k:'snow',c:'#ffffff'});
 if(theme==='desert'&&chance(dt*2))AMBIENT.push({x:-4,y:60+rnd(H-80),vx:14+rnd(10),vy:-1+rnd(2),life:40,age:0,k:'dust',c:'#ffe9b0'});
 if(theme==='cyber'&&chance(dt*4))AMBIENT.push({x:rnd(W),y:H-2,vy:-8-rnd(8),life:3,age:0,k:'spark',c:chance(.5)?'#ff4fd8':'#35e2ff'});
 if(theme==='hall'&&chance(dt*1.2))AMBIENT.push({x:rnd(W),y:rnd(H*.5),vx:4+rnd(6),vy:2+rnd(4),life:6,age:0,k:'petal',c:'#ffb8cc'});
 for(let i=AMBIENT.length-1;i>=0;i--){const a=AMBIENT[i];a.age+=dt;
  if(a.k==='fly'){a.y+=a.vy*dt+Math.sin(G.t*3+a.ph)*4*dt;a.x+=Math.cos(G.t*2+a.ph)*5*dt;}
  else{a.x+=(a.vx||0)*dt;a.y+=(a.vy||0)*dt;}
  if(a.age>a.life||a.y>H+6||a.x>W+6||a.y<-8)AMBIENT.splice(i,1);}
 if(AMBIENT.length>120)AMBIENT.splice(0,AMBIENT.length-120);
}
function emitWeather(dt){
 if(G.weather==='rain'){for(let i=0;i<3;i++)if(chance(dt*60))WEATHERP.push({x:rnd(W+40)-20,y:-4,vy:150+rnd(60),life:3,age:0,k:'rain'});}
 if(G.weather==='snow'){if(chance(dt*30))WEATHERP.push({x:rnd(W),y:-4,vy:24+rnd(16),vx:-6+rnd(12),life:14,age:0,k:'wsnow'});}
 if(G.weather==='star'){if(chance(dt*8))WEATHERP.push({x:rnd(W),y:rnd(H*.4),life:.9,age:0,k:'tw'});}
 for(let i=WEATHERP.length-1;i>=0;i--){const p=WEATHERP[i];p.age+=dt;p.y+=(p.vy||0)*dt;p.x+=(p.vx||0)*dt;if(p.age>p.life||p.y>H+4)WEATHERP.splice(i,1);}
 if(WEATHERP.length>260)WEATHERP.splice(0,WEATHERP.length-260);
}
function clearParticles(){STEAM=[];AMBIENT=[];WEATHERP=[];}

/* ============================================================
   渲染管线
============================================================ */
let nightA=0,ROOMFADE=0;
function render(){
 ctx.imageSmoothingEnabled=false;
 ctx.clearRect(0,0,W,H);
 ctx.drawImage(roomBase(G.curRoom),0,0);
 drawPlaced();
 drawGuests();
 drawActors();
 drawParticles();
 drawNight();
 drawGlow();
 drawWeather();
 if(DRAG&&DRAG.active)drawDragHints();
 if(PLACING)drawGhost();
 if(ROOMFADE>0)drawRoomFade();
}
function drawPlaced(){
 for(const p of placedOf()){
  const f=FACILITIES[p.id],spr=facSprite(p.id);
  const X=p.x*TILE,Y=p.y*TILE;
  // 落地投影
  if(p.id!=='lantern'){
   if(f.kind==='pool')ellipseFill(ctx,X+f.w*TILE/2,Y+f.h*TILE-1,f.w*TILE/2-1,3,'rgba(0,0,0,.18)');
   else{ctx.fillStyle='rgba(0,0,0,.16)';ctx.fillRect(X+1,Y+f.h*TILE-2,f.w*TILE-2,3);}
  }
  if(p.id==='lantern'){
   const sway=Math.sin(G.t*1.6+p.x)*1.2;
   ctx.save();ctx.translate(X+6,Y);ctx.rotate(sway*Math.PI/180);ctx.drawImage(spr,-6,0);ctx.restore();
  }else{
   ctx.drawImage(spr,X,Y);
  }
  if(f.kind==='pool'){
   // 动态水面
   const w=f.w*TILE,h=f.h*TILE;
   ctx.save();poolClip(f,X,Y,w,h);ctx.clip();
   if(!f.sand){
    ctx.fillStyle='#ffffff2a';
    const o1=(G.t*10+p.x*7)%(w-10);ctx.fillRect(X+5+o1,Y+8+Math.sin(G.t+p.x)*2,10,1);
    const o2=(G.t*7+p.x*13+20)%(w-10);ctx.fillRect(X+5+o2,Y+h-12+Math.cos(G.t*.8)*2,8,1);
   }
   if(f.float){
    for(let i=0;i<3;i++){
     const fx=X+10+((i*19+p.x*5)%(w-22)),fy=Y+10+((i*11)%(h-20))+Math.sin(G.t*1.2+i*2+p.x)*1.5;
     if(f.float==='yuzu'){ctx.fillStyle='#ffc23a';ctx.fillRect(fx,fy,4,3);ctx.fillStyle='#ffe98a';ctx.fillRect(fx+1,fy,2,1);}
     else{ctx.fillStyle='#5aa55e';ctx.fillRect(fx,fy,3,2);}
    }
   }
   if(f.bubble&&chance(.2)){ctx.fillStyle='#ffffff55';ctx.fillRect(X+6+rnd(w-14),Y+8+rnd(h-16),1,1);}
   ctx.restore();
   // 泡澡客人身上覆一层水色（下半浸水）
  }
  // 等级角标
  if(f.kind==='pool'&&p.level>1){
   ctx.fillStyle='#ffd45e';ctx.fillRect(X+2,Y+2,2+p.level,5);ctx.fillStyle='#4a2c07';ctx.fillRect(X+2,Y+2,1,1);
  }
 }
}
function drawGuests(){
 // 先画非泡澡的
 for(const gu of G.guests){if(gu.room!==G.curRoom)continue;if(gu.state!=='soak')drawGuest(gu);}
 // 泡澡的 + 水面覆盖
 const pools=placedOf().filter(p=>FACILITIES[p.id].kind==='pool');
 for(const p of pools){
  const f=FACILITIES[p.id],X=p.x*TILE,Y=p.y*TILE,w=f.w*TILE,h=f.h*TILE;
  let any=false;
  for(const gu of G.guests){if(gu.room!==G.curRoom)continue;if(gu.state==='soak'&&gu.poolUid===p.uid){drawGuest(gu);any=true;}}
  if(any){
   ctx.save();poolClip(f,X,Y,w,h);ctx.clip();
   for(const gu of G.guests){if(gu.room!==G.curRoom||gu.state!=='soak'||gu.poolUid!==p.uid)continue;
    const sc=SPECIES[gu.sp].size*.9,bw=Math.round(20*sc);
    ctx.globalAlpha=.55;ctx.fillStyle=f.water;               // 每位客人下半身单独覆水色
    ctx.fillRect(Math.round(gu.x-bw/2),Math.round(gu.y-2),bw,12);
    ctx.globalAlpha=1;
    ctx.fillStyle='#ffffff30';ctx.fillRect(Math.round(gu.x-bw/2),Math.round(gu.y-2),bw,1);
   }
   ctx.restore();
   for(const gu of G.guests){if(gu.room!==G.curRoom||gu.state!=='soak'||gu.poolUid!==p.uid)continue;
    const rx=6+Math.sin(G.t*2+gu.id)*1.5;
    ctx.strokeStyle='#ffffff66';ctx.strokeRect(gu.x-7-rx*.4,gu.y+3,14+rx*.8,3);}
  }
 }
}
function drawGuest(gu){
 const spr=spriteOf(gu.sp,gu.vip),sc=SPECIES[gu.sp].size*(gu.state==='soak'?.9:1);
 let bob=0;
 if(gu.state==='walk'||gu.state==='wander')bob=Math.sin(G.t*10+gu.id)*1;
 if(gu.state==='soak')bob=Math.sin(G.t*1.6+gu.id)*.8;
 if(gu.state==='drag'){bob=(DRAG&&DRAG.touch)?-11:-5;ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(Math.round(gu.x-6),Math.round(gu.y+3),12,2);}
 const dw=Math.round(20*sc),dy=Math.round(gu.y-16*sc+bob);
 ctx.save();
 if(gu.dir<0){ctx.translate(gu.x,0);ctx.scale(-1,1);ctx.translate(-gu.x,0);}
 ctx.drawImage(spr,Math.round(gu.x-10*sc),dy,dw,dw);
 ctx.restore();
 if(gu.vip){const a=G.t*3+gu.id;ctx.fillStyle='#ffd45e';for(let i=0;i<3;i++){const ang=a+i*2.1;ctx.fillRect(gu.x+Math.cos(ang)*11-1,gu.y-6+Math.sin(ang)*5-1,2,2);}}
 // 心愿图标
 if(gu.wish&&!gu.wishDone&&gu.state!=='leave'&&gu.state!=='gone'){
  const ix=Math.round(gu.x-5),iy=Math.round(gu.y-24*sc+bob+Math.sin(G.t*3)*1);
  ctx.fillStyle='#fff6e0';ctx.fillRect(ix,iy,10,9);ctx.fillStyle='#241207';ctx.fillRect(ix-1,iy-1,12,1);ctx.fillRect(ix-1,iy+9,12,1);ctx.fillRect(ix-1,iy,1,9);ctx.fillRect(ix+10,iy,1,9);
  drawWishIcon(ix+1,iy+1,gu.wish.type);
 }
 if(gu.state==='soak')soakChatter(gu);
}
function drawWishIcon(x,y,type){
 if(type==='pool'){ctx.fillStyle='#5ad0a6';ctx.fillRect(x+1,y+3,8,4);ctx.fillStyle='#fff';ctx.fillRect(x+2,y+2,2,1);}
 else if(type==='snack'){ctx.fillStyle='#e86a5a';ctx.fillRect(x+2,y+1,6,7);ctx.fillStyle='#fff6e0';ctx.fillRect(x+3,y+3,4,2);}
 else if(type==='photo'){ctx.fillStyle='#4a4a5a';ctx.fillRect(x+1,y+2,8,5);ctx.fillStyle='#8fd3ff';ctx.fillRect(x+3,y+3,3,3);}
 else{ctx.fillStyle='#8fd3ff';ctx.fillRect(x+2,y+1,4,4);ctx.fillRect(x+3,y+5,2,2);ctx.fillRect(x+7,y+2,1,1);ctx.fillRect(x+7,y+4,1,1);}
}
function drawParticles(){
 for(const s of STEAM){const a=1-s.age/s.life;ctx.fillStyle=`rgba(240,246,255,${a*.32})`;const r=s.r*(1+s.age*.7);ctx.fillRect(s.x-r/2,s.y-r/2,r,r);}
 for(const a of AMBIENT){
  const tw=a.k==='fly'||a.k==='spark'?(.5+.5*Math.sin(G.t*6+a.x)):.9;
  ctx.globalAlpha=tw*(1-a.age/a.life);ctx.fillStyle=a.c;
  ctx.fillRect(a.x,a.y,a.k==='petal'?3:2,a.k==='petal'?2:2);ctx.globalAlpha=1;
 }
 for(const s of SPARKS){const a=1-s.age/s.life;ctx.globalAlpha=a;ctx.fillStyle=s.c;ctx.fillRect(s.x,s.y,2,2);ctx.globalAlpha=1;}
}
function drawNight(){
 const target=G.period.light;
 nightA+=(target-nightA)*.02;
 if(nightA>.01){ctx.fillStyle=`rgba(18,12,48,${nightA*.72})`;ctx.fillRect(0,0,W,H);}
 if(G.period.id==='dusk'){ctx.fillStyle='rgba(255,140,60,.10)';ctx.fillRect(0,0,W,H);}
}
function drawGlow(){
 ctx.save();ctx.globalCompositeOperation='lighter';
 const gl=clamp(nightA*1.6,.25,1);
 for(const p of placedOf()){
  const f=FACILITIES[p.id];
  if(p.id==='lantern'){glowCircle(p.x*TILE+6,p.y*TILE+8,16,`rgba(255,180,90,${.34*gl})`);}
  if(f.glow){glowCircle(p.x*TILE+f.w*TILE/2,p.y*TILE+f.h*TILE/2,34,`rgba(160,180,255,${.20*gl})`);}
  if(p.id==='vender'){glowCircle(p.x*TILE+16,p.y*TILE+12,14,`rgba(255,220,150,${.18*gl})`);}
 }
 const theme=ROOMS.find(r=>r.id===G.curRoom).theme;
 if(theme==='cyber'){glowCircle(W-70,WALL_H*TILE/2,26,`rgba(240,240,210,${.16*gl})`);}
 ctx.restore();
 function glowCircle(x,y,r,color){const gr=ctx.createRadialGradient(x,y,1,x,y,r);gr.addColorStop(0,color);gr.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}
}
function drawWeather(){
 if(G.weather==='rain'){ctx.strokeStyle='rgba(160,200,255,.4)';ctx.beginPath();for(const p of WEATHERP)if(p.k==='rain'){ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-2,p.y+6);}ctx.stroke();ctx.fillStyle='rgba(30,40,80,.12)';ctx.fillRect(0,0,W,H);}
 if(G.weather==='snow'){ctx.fillStyle='rgba(255,255,255,.85)';for(const p of WEATHERP)if(p.k==='wsnow')ctx.fillRect(p.x,p.y,2,2);}
 if(G.weather==='star'){for(const p of WEATHERP)if(p.k==='tw'){const a=Math.sin(p.age/p.life*Math.PI);ctx.globalAlpha=a;ctx.fillStyle='#ffe9a8';ctx.fillRect(p.x,p.y,2,2);ctx.globalAlpha=1;}}
}
function computeGhost(){
 const f=FACILITIES[PLACING];if(!f)return;
 GHOST.tx=Math.floor(GHOST.x/TILE-f.w/2);GHOST.ty=Math.floor(GHOST.y/TILE-f.h/2);
 GHOST.ok=canPlace(PLACING,GHOST.tx,GHOST.ty)&&G.coins>=f.cost;
}
function drawGhost(){
 const f=FACILITIES[PLACING];computeGhost();
 ctx.globalAlpha=.62;ctx.drawImage(facSprite(PLACING),GHOST.tx*TILE,GHOST.ty*TILE);ctx.globalAlpha=1;
 ctx.strokeStyle=GHOST.ok?'#5ad0a6':'#ff5a6a';ctx.lineWidth=1;ctx.strokeRect(GHOST.tx*TILE+.5,GHOST.ty*TILE+.5,f.w*TILE-1,f.h*TILE-1);
}
function drawRoomFade(){
 const r=ROOMS.find(x=>x.id===G.curRoom);
 ctx.globalAlpha=Math.min(1,ROOMFADE);
 ctx.fillStyle='rgba(10,6,20,.55)';const tw=r.name.length*16+24;ctx.fillRect(W/2-tw/2,H/2-16,tw,32);
 ctx.fillStyle='#ffd45e';ctx.font="14px 'YouYuan','Microsoft YaHei',sans-serif";ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillText(r.name,W/2,H/2);
 ctx.globalAlpha=1;ctx.textAlign='left';
}
function sparks(x,y,c,n=6){for(let i=0;i<n;i++)SPARKS.push({x,y,vx:rnd(-24,24),vy:rnd(-40,-8),life:.6+rnd(.4),age:0,c,dt:0});}

/* ============================================================
   输入 · 拖拽放置客人
============================================================ */
let DRAG=null;
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
 sndInit();if(!G.running||G.paused)return;
 e.preventDefault();
 const w=toWorld(e.clientX,e.clientY);
 if(PLACING){
  GHOST.x=w.x;GHOST.y=w.y;computeGhost();
  if(GHOST.ok)placeFac(PLACING,GHOST.tx,GHOST.ty);
  if(!e.shiftKey)PLACING=null,cv.style.cursor='';
  return;
 }
 // 客人：按住可拖拽，轻点则闲聊（触控判定更宽松）
 const touch=e.pointerType==='touch';
 for(const gu of G.guests){
  if(gu.room!==G.curRoom||gu.state==='gone')continue;
  const hx=touch?16:12,hy=touch?18:14;
  if(Math.abs(w.x-gu.x)<hx&&Math.abs(w.y-(gu.y-6))<hy){DRAG={gu,sx:w.x,sy:w.y,active:false,touch};return;}
 }
 // 设施

function pickFresh(arr,key){
 if(!arr||!arr.length)return null;
 const used=G.fresh[key]||(G.fresh[key]=[]);
 let pool=arr.map((v,i)=>i).filter(i=>!used.includes(i));
 if(!pool.length){used.length=0;pool=arr.map((v,i)=>i);}
 const i=pick(pool);
 used.push(i);if(used.length>Math.max(1,arr.length-1))used.shift();
 return arr[i];
}

   客人生成（加权：偏好可达 + 风口情报 + VIP）

function poolTypeExists(type){for(const rid in G.rooms)if(G.rooms[rid].placed.some(p=>p.id===type))return true;return false;}
function allPools(){const out=[];for(const rid in G.rooms){const r=G.rooms[rid];for(const p of r.placed){const f=FACILITIES[p.id];if(f.kind==='pool')out.push({p,rid,f});}}return out;}
function decoInRoom(rid,id){return G.rooms[rid].placed.find(p=>p.id===id);}
function guestCap(){return 4+storeStars();}
function storeStars(){const r=G.rep;return r>=140?5:r>=90?4:r>=55?3:r>=28?2:r>=12?1:0;}

function spawnUpdate(dt){
 G.spawnT-=dt;
 if(G.spawnT>0)return;
 const stars=storeStars();
 G.spawnT=clamp(10-stars*.9,4,11)*(G.weather==='rain'||G.weather==='snow'?.8:1)*(G.period.id==='late'?1.5:1);
 if(G.guests.length>=guestCap())return;
 spawnGuest();
}
function chooseSpecies(){
 const avail=allPools().map(o=>o.p.id);
 const weights=SPECIES_IDS.map(sp=>{
  const s=SPECIES[sp];let w=1;
  if(s.likes.some(L=>avail.includes(L)))w+=2.2;
  if(avail.includes(s.dislike))w+=.3; // 也有人来凑热闹
  if(G.intel.topic&&s.likes.includes(G.intel.topic))w+=2.5;
  if(s.solo)w*=.6;                     // 独行客来得少些
  return w;
 });
 let sum=weights.reduce((a,b)=>a+b,0),r=rnd(sum);
 for(let i=0;i<SPECIES_IDS.length;i++){r-=weights[i];if(r<=0)return SPECIES_IDS[i];}
 return pick(SPECIES_IDS);
}
function choosePoolFor(sp){
 const s=SPECIES[sp];
 const occOf=p=>G.guests.filter(g=>g.poolUid===p.uid&&(g.state==='soak'||g.state==='walk'));
 const opts=allPools().filter(o=>{
  const occ=occOf(o.p);
  if(o.f.solo&&sp!=='hedg')return false;               // 独汤只属于刺猬
  if(sp==='hedg')return occ.length===0;                // 刺猬只进空池
  return !occ.some(g=>g.sp==='hedg');                  // 刺猬包场时别人不进
 });
 if(!opts.length)return null;
 const scored=opts.map(o=>{
  let w=1;
  if(s.likes.includes(o.p.id))w+=4;
  if(s.dislike===o.p.id)w-=3;
  if(sp==='hedg'&&o.f.solo)w+=6;
  if(G.intel.topic===o.p.id)w+=2;
  const occupants=occOf(o.p).length;
  if(occupants>=poolCap(o.p))w-=10;else w-=occupants*.8;
  return{o,w};
 }).sort((a,b)=>b.w-a.w);
 const top=scored.filter(s2=>s2.w>0);
 if(!top.length)return chance(.4)?scored[0].o:null;
 const sum=top.reduce((a,b)=>a+b.w,0);let r=rnd(sum);
 for(const t of top){r-=t.w;if(r<=0)return t.o;}
 return top[0].o;
}
function poolBlocks(f,X,Y){
 const cols=(f.shape==='rect'&&f.w>f.h)?3:2; // 长方形 2×3=6 块；圆/方/菱形 2×2=4 块
 const wT=f.w*TILE,hT=f.h*TILE,out=[];
 for(let r=0;r<2;r++)for(let c=0;c<cols;c++)
  out.push({x0:X+c*wT/cols,x1:X+(c+1)*wT/cols,y0:Y+r*hT/2,y1:Y+(r+1)*hT/2});
 return out;
}
function poolCap(p){const f=FACILITIES[p.id];return f.cap+(p.level>=3?1:0);}
function pickSoakPos(p,gu){
 const f=FACILITIES[p.id],X=p.x*TILE,Y=p.y*TILE,wT=f.w*TILE,hT=f.h*TILE;
 const blocks=poolBlocks(f,X,Y);
 const others=G.guests.filter(g=>g!==gu&&g.poolUid===p.uid&&(g.state==='soak'||g.state==='walk'));
 const taken=others.map(o=>o.block).filter(b=>b!=null);
 const freeIdx=blocks.map((b,i)=>i).filter(i=>!taken.includes(i));
 const idx=freeIdx.length?pick(freeIdx):ri(0,blocks.length-1);
 const b=blocks[idx];
 const upper=b.y0<Y+hT/2;
 let x=(b.x0+b.x1)/2;              // 块中心 x（固定网格）
 let y=upper?Y+Math.round(hT*.28):Y+Math.round(hT*.62);  // 后排 28%、前排 62%，用满池子纵深
 if(f.shape==='round'){           // 圆形：x 收向池心
  const cx=X+wT/2,cy=Y+hT/2,rx=wT/2-8,ry=hT/2-8;
  const hw=rx*Math.sqrt(Math.max(0,1-((y-cy)*(y-cy))/(ry*ry)));
  x=clamp(x,cx-hw+2,cx+hw-2);
 }else if(f.shape==='diamond'){    // 菱形：x 收向池心
  const cx=X+wT/2,cy=Y+hT/2,rx=wT/2-8,ry=hT/2-8;
  const k=Math.max(0,1-Math.abs(y-cy)/ry);
  x=clamp(x,cx-rx*k+2,cx+rx*k-2);
 }
 if(gu)gu.block=idx;
 return{x,y};
}
function freeSlot(p,ignore){
 const f=FACILITIES[p.id];
 const taken=G.guests.filter(g=>g!==ignore&&g.poolUid===p.uid&&(g.state==='soak'||g.state==='walk')).map(g=>g.slot);
 for(let i=0;i<poolCap(p);i++)if(!taken.includes(i))return i;
 return -1;
}
function makeWish(sp){
 const s=SPECIES[sp];
 if(sp==='hedg')return{type:'quiet'};   // 刺猬的心愿永远是独处
 const types=['pool','quiet'];
 if(decoInRoom('hall','vender')||allRoomsHas('vender'))types.push('snack');
 if(allRoomsHas('camera'))types.push('photo');
 const type=pick(types);
 if(type==='pool'){
  const avail=allPools().map(o=>o.p.id);
  const prefer=avail.filter(t=>s.likes.includes(t));
  return{type,pool:prefer.length?pick(prefer):(avail.length?pick(avail):null)};
 }
 return{type};
}
function allRoomsHas(id){for(const rid in G.rooms)if(G.rooms[rid].placed.some(p=>p.id===id))return true;return false;}

function spawnGuest(forced){

 const vip=forced&&forced.vip||chance(.04+storeStars()*.02);
 const target=choosePoolFor(sp);

 };
 if(sp==='hedg')gu.patience=40+rnd(10);   // 为了空汤，刺猬愿意多等等

 G.stats.guests++;
 if(!G.dragHinted){G.dragHinted=true;setTimeout(()=>toast('小贴士：按住客人可以拖到 TA 喜欢的汤池','#8fd3ff'),1200);}
 G.dex[sp]=(G.dex[sp]||0)+1;checkDexReward();
 if(G.level)G.levelProg.guests++;

 else if(chance(.5)){const line=pickFresh(TEXT[sp].enter,'e'+sp);bubble(gu,line);}

/* ============================================================
   客人状态机
============================================================ */
function updateGuest(gu,dt){
 gu.stateT+=dt;gu.chatCd=Math.max(0,gu.chatCd-dt);
 const s=SPECIES[gu.sp];
 switch(gu.state){
 case 'enter':{
  if(gu.target){startWalkToPool(gu,gu.target);}
  else{gu.state='wander';gu.stateT=0;gu.wanderT=0;}
  break;}
 case 'drag':break; // 被玩家抓着，位置由指针驱动
 case 'wander':{
  gu.patience-=dt;
  gu.wanderT=(gu.wanderT||0)-dt;
  if(gu.wanderT<=0){
   gu.wanderT=2.2;
   const t=choosePoolFor(gu.sp);
   if(t){startWalkToPool(gu,t);break;}
   const nx=40+rnd(W-80),ny=WALL_H*TILE+14+rnd(H-WALL_H*TILE-30);
   gu.targetX=nx;gu.targetY=ny;gu.state='stroll';
  }
  if(gu.patience<=0){gu.sat-=18;startLeave(gu,'等太久了……');}
  break;}
 case 'stroll':{
  if(moveTo(gu,gu.targetX,gu.targetY,dt))gu.state='wander';
  break;}
 case 'walk':{
  if(moveTo(gu,gu.targetX,gu.targetY,dt)){
   if(gu.destKind==='pool'){
    let p=null,rid=gu.room;
    for(const r2 in G.rooms){const q=G.rooms[r2].placed.find(x=>x.uid===gu.poolUid);if(q){p=q;rid=r2;break;}}
    if(!p){gu.poolUid=null;gu.block=null;gu.state='wander';break;}
    gu.room=rid;                                     // 跨房间到店：客人跟着池子走
    const f=FACILITIES[p.id];
    const occ=G.guests.filter(g=>g!==gu&&g.poolUid===p.uid&&(g.state==='soak'||g.state==='walk'));
    if(gu.sp==='hedg'&&occ.length){bubble(gu,pick(TEXT.hedg.refuse));gu.poolUid=null;gu.block=null;gu.state='wander';gu.wanderT=1;break;}
    if((f.solo&&gu.sp!=='hedg')||occ.some(g=>g.sp==='hedg')){bubble(gu,'这池子被包下了……换一池吧。');gu.poolUid=null;gu.block=null;gu.state='wander';gu.wanderT=1;break;}
    const sl=freeSlot(p,gu);
    if(sl<0){gu.poolUid=null;gu.block=null;gu.state='wander';gu.patience=Math.min(gu.patience,12);bubble(gu,'满员了……等等吧。');break;}
    gu.slot=sl;const sp2=pickSoakPos(p,gu);gu.x=sp2.x;gu.y=sp2.y;
    beginSoak(gu,p);
   }else if(gu.destKind==='vender'){
    if(!allRoomsHas('vender')){gu.state='wander';gu.wanderT=.5;break;}   // 走到一半摊子被拆了
    gu.sat+=8;earn(8,'零食');finishWish(gu);gu.state='wander';gu.wanderT=.5;
    sparks(gu.x,gu.y-8,'#ffd45e');
   }else if(gu.destKind==='camera'){
    if(!allRoomsHas('camera')){gu.state='wander';gu.wanderT=.5;break;}
    gu.sat+=8;earn(4,'合影');finishWish(gu);sparks(gu.x,gu.y-10,'#8fd3ff');gu.state='wander';gu.wanderT=.5;
   }
  }
  break;}
 case 'soak':{
  gu.soakT+=dt;gu.tickT-=dt;gu.chatterT-=dt;
  const p=placedOf(gu.room).find(q=>q.uid===gu.poolUid);
  const f=p&&FACILITIES[p.id];
  if(!p){gu.state='wander';break;}
  // 契合度
  const like=s.likes.includes(p.id),dis=s.dislike===p.id;
  gu.sat+=dt*(like?2.6:(dis?-2.2:1.1))*(p.level*.35+.65);
  gu.sat+=dt*(f.eff.joy*.22+f.eff.relax*.22)*(1+(G.staff.dj&&G.period.income>1?.15:0));
  if(G.weather==='rain'&&p.id==='hot')gu.sat+=dt*.8;
  if(G.clean<30)gu.sat-=dt*.8;
  gu.sat=clamp(gu.sat,0,100);
  // 产币（单日上限）
  if(gu.tickT<=0){
   gu.tickT=3;
   const cap=100+p.level*50;
   let gain=Math.round((1+f.eff.coin)*(G.period.income)*(gu.vip?2:1));
   if(f.coinGen&&p.daily<cap){p.daily+=gain;earn(gain,null,false);}
   else if(!f.coinGen){earn(Math.max(1,gain-1),null,false);}
  }
  // 心愿：泡指定池
  if(gu.wish&&!gu.wishDone&&gu.wish.type==='pool'&&gu.wish.pool===p.id)finishWish(gu);
  if(gu.wish&&!gu.wishDone&&gu.wish.type==='quiet'&&!gu.tapped&&gu.soakT>10)finishWish(gu);
  // 区域差异化小行为
  gu.quirkT=(gu.quirkT||8+rnd(6))-dt;
  if(gu.quirkT<=0){gu.quirkT=14+rnd(12);regionQuirk(gu);}
  if(gu.soakT>=gu.soakMax){endSoak(gu);}
  break;}
 case 'leave':{
  const ex=gu.exitLeft?-24:W+24;
  if(moveTo(gu,ex,gu.y,dt)){finishReview(gu);gu.state='gone';}
  break;}
 }
}
function moveTo(gu,tx,ty,dt){
 const dx=tx-gu.x,dy=ty-gu.y,d=Math.hypot(dx,dy);
 if(d<2){gu.x=tx;gu.y=ty;return true;}
 gu.dir=dx>=0?1:-1;
 gu.x+=dx/d*gu.speed*dt;gu.y+=dy/d*gu.speed*dt*.7;
 return false;
}
function startWalkToPool(gu,t){
 const p=t.p;const sl=freeSlot(p,gu);
 if(sl<0){gu.target=null;gu.state='wander';gu.wanderT=1.5;return;}
 gu.slot=sl;gu.poolUid=p.uid;gu.destKind='pool';   // 先占位，防止多人同抢一格
 const pos=pickSoakPos(p,gu);
 gu.targetX=pos.x;gu.targetY=pos.y;gu.state='walk';
}
function beginSoak(gu,p){
 gu.state='soak';gu.stateT=0;gu.soakT=0;gu.tickT=2.5;gu.lastPool=p.id;gu.poolUid=p.uid;
 if(!gu.paid){gu.paid=true;earn(Math.round(gu.pay*G.period.income),'入场费');}
 if(gu.sp==='hedg'){gu.sat=clamp(gu.sat,0,100);bubble(gu,pick(TEXT.hedg.alone));p.quills=3;}
 else if(p.quills>0){
  p.quills--;gu.sat=clamp(gu.sat-3,0,100);
  bubble(gu,pick(QUILL_LINES));sparks(gu.x,gu.y-8,'#c8a878',4);
 }
 if(G.level)G.levelProg.guestsSoaked=(G.levelProg.guestsSoaked||0)+1;
}
function endSoak(gu){
 gu.state='wander';gu.wanderT=.1;gu.poolUid=null;gu.block=null;
 // 泡完后处理剩余心愿
 const w=gu.wish;
 if(w&&!gu.wishDone){
  if(w.type==='snack'&&allRoomsHas('vender')){
   const v=firstDeco('vender');gu.room=v.rid;gu.destKind='vender';gu.targetX=v.p.x*TILE+16;gu.targetY=v.p.y*TILE+40;gu.state='walk';return;
  }
  if(w.type==='photo'&&allRoomsHas('camera')){
   const c=firstDeco('camera');gu.room=c.rid;gu.destKind='camera';gu.targetX=c.p.x*TILE+8;gu.targetY=c.p.y*TILE+24;gu.state='walk';return;
  }
  if(w.type==='quiet'&&!gu.tapped&&gu.soakT>=10){} // 已在 soak 中结算
 }
 if(chance(.6))startLeave(gu);else{gu.patience=14;}
}
function firstDeco(id){for(const rid in G.rooms){const p=G.rooms[rid].placed.find(q=>q.id===id);if(p)return{p,rid};}return null;}
function startLeave(gu,mutter){
 gu.state='leave';gu.exitLeft=gu.x<W/2;
 if(mutter)bubble(gu,mutter);
}
function finishWish(gu){
 if(!gu.wish||gu.wishDone)return;
 gu.wishDone=true;gu.sat=clamp(gu.sat+16,0,100);
 earn(6,'小费');G.rep=clamp(G.rep+1.5,0,200);
 G.stats.wish++;
 if(G.level)G.levelProg.wish++;
 bubble(gu,pickFresh(WISH_DONE,'w'+gu.sp),true);
 sparks(gu.x,gu.y-14,'#ffd45e',8);SFX.good();
}
function finishReview(gu){
 const hearts=clamp(Math.round(gu.sat/20+rnd(-.4,.4)+(G.clean>70?.3:0)),1,5);
 const good=hearts>=4;
 const poolName=(()=>{const t=gu.lastPool;return t?FACILITIES[t].name:'汤屋';})();
 let dRep=hearts>=5?4:hearts===4?2.5:hearts===3?.5:hearts===2?-2.5:-4;
 if(G.staff.clean&&!good)dRep*=.5;
 G.rep=clamp(G.rep+dRep,0,200);
 G.stats.reviews++;if(good)G.stats.goodrev++;
 if(G.level&&good)G.levelProg.goodrev++;
 const line=pick(REVIEWS[hearts]).replace('{s}',SPECIES[gu.sp].name).replace('{p}',poolName);
 toast('♥'.repeat(hearts)+' '+line,good?'#5ad0a6':'#ff8ba7');
 if(good){if(chance(.35))G.gems+=1;}
 if(G.mode==='free'&&hearts===5&&chance(.3))banner(pick(EVENT_TEXT.vip).replace('{n}',gu.name+'（'+SPECIES[gu.sp].name+'）'),'回头客带朋友来啦');
}

 if(!chance(.30))return;
 const roll=Math.random();
 if(roll<.22){ // 贵客
  if(G.guests.length<guestCap()+2)spawnGuest({vip:true,sp:pick(SPECIES_IDS)});
 }else if(roll<.42){ // 汤涌
  banner(pick(EVENT_TEXT.spring),'泉水的馈赠');
  for(const gu of G.guests)if(gu.state==='soak')gu.sat=clamp(gu.sat+10,0,100);
 }else if(roll<.58){ // 网红探店
  G.rep=clamp(G.rep+6,0,200);
  banner(pick(EVENT_TEXT.influencer).replace('{s}',SPECIES.capy.name),'声望 +6');SFX.good();
 }else if(roll<.72){ // 微风

 }else if(roll<.86&&G.intel.topic){ // 情报发酵
  const t=G.intel.topic;banner(`「${FACILITIES[t].name}」上了山林小报头条！`,INTEL_NOTE[t]);
  G.rep=clamp(G.rep+3,0,200);
 }else if(G.rooms.cyber&&G.rooms.cyber.unlocked){
  toast(pick(EVENT_TEXT.blackout),'#ff8ba7');
 }

 G.day++;

 // 日结

function drawClock(){
 const c=$('#clockCv'),g=c.getContext('2d');g.clearRect(0,0,22,22);
 const night=G.period.light>=.4;
 g.fillStyle=night?'#2c2c4e':'#fff6e0';g.beginPath();g.arc(11,11,9,0,7);g.fill();
 g.fillStyle=night?'#8a8ad0':'#6b4226';
 g.fillRect(10,2,2,2);g.fillRect(10,18,2,2);g.fillRect(2,10,2,2);g.fillRect(18,10,2,2);
 const ha=((G.hour%12)/12)*Math.PI*2-Math.PI/2,ma=(G.hour%1)*Math.PI*2-Math.PI/2;
 g.strokeStyle='#221610';g.lineWidth=2;
 g.beginPath();g.moveTo(11,11);g.lineTo(11+Math.cos(ha)*4,11+Math.sin(ha)*4);g.stroke();
 g.beginPath();g.moveTo(11,11);g.lineTo(11+Math.cos(ma)*7,11+Math.sin(ma)*7);g.stroke();
 g.fillStyle='#c84a3a';g.fillRect(10,10,2,2);
}

const EFF_PHRASE={coin:'汤底更浓，金币满钵',joy:'笑声更多，心情飞扬',fame:'名声远扬，客似云来',explore:'野趣更足，探险者至',relax:'雾气更柔，解乏安神',social:'池边热闹，交朋结友',effcy:'周转更快，翻台利落',sign:'金字招牌，远近闻名'};
function onFacTap(p){openFacPanel(p);}
function openFacPanel(p){
 const f=FACILITIES[p.id];
 const isPool=f.kind==='pool';
 let effHtml='';
 for(const[k,v]of Object.entries(f.eff||{})){
  if(!v&&!isPool)continue;
  const lv=v*p.level;

   (lv>0?`<div class="bar"><i style="width:${clamp(lv*18,4,100)}%"></i></div>`:'');
 }
 let extra='';
 if(isPool){
  const cap=100+p.level*50;
  const lovers=SPECIES_IDS.filter(sp=>SPECIES[sp].likes.includes(p.id)).map(sp=>SPECIES[sp].name).join('、');
  const haters=SPECIES_IDS.filter(sp=>SPECIES[sp].dislike===p.id).map(sp=>SPECIES[sp].name).join('、')||'无';
  extra=`<div class="hr"></div>
  <div class="kv"><span>容量</span><b>${poolCap(p)} 位${p.level>=3?' ·满级加座':''}</b></div>
  ${p.quills>0?`<div class="kv"><span>残留小刺</span><b style="color:#ff9ab0">还有 ${p.quills} 位客人会被扎</b></div>`:''}
  <div class="kv"><span>今日产币</span><b>${f.coinGen?p.daily+' / '+cap:'非产币汤'}</b></div>
  <div class="bar"><i style="width:${f.coinGen?clamp(p.daily/cap*100,0,100):0}%"></i></div>
  <div class="kv" style="margin-top:6px"><span>偏爱</span><b style="color:#5ad0a6">${lovers||'—'}</b></div>
  <div class="kv"><span>无感</span><b style="color:#ff8ba7">${haters}</b></div>`;
 }
 const upCost=Math.round(f.cost*.75*p.level);

 const dlg=openModal(`${f.name} · Lv${p.level}`,
  `<div class="center mut" style="margin-bottom:6px">「${f.story||f.desc}」</div>${effHtml}${extra}`,
  [
   {t:'拆除（返 '+Math.round(f.cost*.5*p.level)+'）',cls:'rose',fn:()=>{demolish(p);}},
   canUp?{t:`升级 🪙${upCost}`,cls:'gold',fn:()=>{upgrade(p,upCost);}}:{t:'已满级',cls:'ghost'},
  ]);
}
function upgrade(p,cost){
 if(G.coins<cost){toast('金币不够啦','#ff8ba7');SFX.bad();return;}
 G.coins-=cost;p.level++;
 SFX.levelup();toast(`${FACILITIES[p.id].name} 升到 Lv${p.level}！`,'#ffd45e');

 closeModal();SFX.pop();toast('已拆除','#ffb45e');
}

  html+=`<div class="row"><canvas data-staff-spr="${k}" width="40" height="40" style="cursor:pointer"></canvas>

   <div class="sub">${s.desc}<br><span class="mut">「${s.story}」</span><br><span class="mut">${s.lore}</span></div></div>
   <button class="pbtn mini ${hired?'rose':'jade'}" data-staff="${k}">${hired?'解雇':'雇佣'}</button></div>`;
 }
 html+=`<div class="hr"></div><div class="kv"><span>今日洁净度</span><b>${Math.round(G.clean)}%</b></div>
  <div class="bar"><i style="width:${G.clean}%"></i></div>
  <div class="mut center" style="margin-top:6px">点一点员工的头像，听听他们想说什么</div>`;
 const dlg=openModal('员工名册',html,[{t:'关闭',cls:'ghost'}]);
 dlg.querySelectorAll('[data-staff]').forEach(btn=>btn.onclick=()=>{
  const k=btn.dataset.staff;
  if(G.staff[k]){delete G.staff[k];G.actors=G.actors.filter(a=>a.k!==k);toast(`${STAFF[k].name} 离职了`,'#ffb45e');}
  else{
   if(G.coins<STAFF[k].cost){toast('金币不够啦','#ff8ba7');SFX.bad();return;}
   G.coins-=STAFF[k].cost;G.staff[k]=true;G.actors.push(makeActor(k));toast(`${STAFF[k].name} 入职！`,'#5ad0a6');SFX.good();
  }
  openStaff();
 });
 dlg.querySelectorAll('[data-staff-spr]').forEach(c=>{
  const k=c.dataset.staffSpr,g=c.getContext('2d');g.imageSmoothingEnabled=false;
  g.drawImage(staffSprite(k),0,0,40,40);
  c.onclick=()=>{SFX.click();toast(`${STAFF[k].name}：${pick(STAFF[k].lines)}`,'#ffe9a8');};
 });
}

/* ============================================================
   图鉴面板
============================================================ */
function openDex(){
 const seen=SPECIES_IDS.filter(sp=>G.dex[sp]>0).length;
 let html=`<div class="center mut" style="margin-bottom:8px">收集进度 ${seen}/${SPECIES_IDS.length} · 集齐有惊喜奖励</div>`;
 for(const sp of SPECIES_IDS){
  const s=SPECIES[sp],seenIt=G.dex[sp]>0;
  const likes=s.likes.map(L=>`<span class="tag like">${FACILITIES[L].name}</span>`).join('');
  html+=`<div class="row"><canvas data-sp="${sp}" width="40" height="40"></canvas>
   <div class="info"><div class="name">${seenIt?s.name+' · '+s.perso:'？？？'}</div>
   <div class="sub">${seenIt?`来过 ${G.dex[sp]} 次 · ${likes} <span class="tag dis">避开 ${FACILITIES[s.dislike].name}</span><br><span class="mut">${LORE[sp]}</span>`:'还没见过这位客人'}</div></div></div>`;
 }
 const dlg=openModal('汤客图鉴',html,[{t:'关闭',cls:'ghost'}]);
 dlg.querySelectorAll('[data-sp]').forEach(c=>{
  const sp=c.dataset.sp,g=c.getContext('2d');g.imageSmoothingEnabled=false;
  const spr=spriteOf(sp,false);
  g.drawImage(spr,0,0,40,40);
  if(!G.dex[sp]){g.globalCompositeOperation='source-atop';g.fillStyle='#241207';g.fillRect(0,0,40,40);g.globalCompositeOperation='source-over';}
 });
}

/* ============================================================
   关卡模式
============================================================ */
function openLevels(){
 let html='<div class="mut center" style="margin-bottom:8px">限定天数内完成任务目标，按表现评级</div>';
 for(const lv of LEVELS){
  const done=G.levelDone[lv.id];
  html+=`<div class="row"><div class="info"><div class="name">第${lv.id}关 · ${lv.name} ${done?`<span class="tag like">${done}</span>`:''}</div>
   <div class="sub">${lv.desc}<br><span class="tag">限${lv.days}天</span><span class="tag">资金🪙${lv.coins}</span><span class="tag" style="background:#3a2a4a;color:#d8b8ff">奖励✦${lv.reward}</span></div></div>
   <button class="pbtn mini gold" data-lv="${lv.id}">${done?'再挑战':'开始'}</button></div>`;
 }
 const dlg=openModal('关卡模式',html,[{t:'返回',cls:'ghost'}]);
 dlg.querySelectorAll('[data-lv]').forEach(btn=>btn.onclick=()=>startLevel(LEVELS.find(l=>l.id==btn.dataset.lv)));
}
const GOAL_NAME={guests:'招待泡汤',wish:'完成心愿',goodrev:'满意点评',nightcoin:'夜间收入',rep:'声望达到'};
function goalVal(g){
 if(g.type==='guests')return G.levelProg.guestsSoaked||0;
 if(g.type==='wish')return G.levelProg.wish;
 if(g.type==='goodrev')return G.levelProg.goodrev;
 if(g.type==='nightcoin')return G.levelProg.nightcoin;
 if(g.type==='rep')return Math.round(G.rep);
 return 0;
}
function startLevel(lv){
 closeModal();resetState();
 G.mode='level';G.level=lv;G.coins=lv.coins;G.rep=20;
 starterLayout();spawnActors();
 G.running=true;G.paused=false;
 $('#intro').classList.add('off');
 banner(`第${lv.id}关 · ${lv.name}`,lv.desc);
 renderRoomTabs();paintWeatherIcon();
}
function checkLevelGoals(){checkLevelEnd();}
function checkLevelEnd(){
 const lv=G.level;if(!lv)return;
 if(G.day>lv.days||lv.goals.every(g=>goalVal(g)>=g.n)){
  const ok=lv.goals.every(g=>goalVal(g)>=g.n);
  const margin=(lv.days-(G.day-1))/lv.days;
  const rank=!ok?'C':(margin>=.5?'S':margin>=.15?'A':'B');
  const reward=ok?lv.reward+(rank==='S'?2:0):0;
  if(ok){G.gems+=reward;G.levelDone[lv.id]=(G.levelDone[lv.id]&&G.levelDone[lv.id]!=='C')?(G.levelDone[lv.id]<rank?rank:G.levelDone[lv.id]):rank;}
  try{localStorage.setItem(SAVEKEY+'.levels',JSON.stringify(G.levelDone));}catch(e){saveErr('保存关卡进度',e);}
  G.level=null;G.running=false;SFX[ok?'levelup':'bad']();
  const rows=lv.goals.map(g=>`<div class="kv"><span>${GOAL_NAME[g.type]}</span><b>${Math.min(goalVal(g),g.n)} / ${g.n}</b></div>`).join('');
  openModal(`关卡结算 · ${lv.name}`,`
   <div class="center" style="font-size:40px;color:${ok?'#ffd45e':'#ff8ba7'};letter-spacing:6px;margin:8px 0">${rank} 级</div>
   ${rows}
   <div class="hr"></div>
   <div class="kv"><span>奖励星星</span><b>${ok?'✦'+reward:'无'}</b></div>
   <p class="mut center" style="margin-top:8px">${ok?(rank==='S'?'完美经营，汤屋传奇！':rank==='A'?'干净利落，好评如潮！':'有惊无险，顺利过关'):'差一点点……再试一次吧'}</p>`,
   [{t:'返回主页',cls:'gold',fn:()=>{closeModal();showIntro();}}]);
 }
}
function showLevelProg(){
 const lv=G.level;if(!lv)return;
 const rows=lv.goals.map(g=>`<div class="kv"><span>${GOAL_NAME[g.type]}</span><b>${Math.min(goalVal(g),g.n)} / ${g.n}</b></div>
  <div class="bar"><i style="width:${clamp(goalVal(g)/g.n*100,0,100)}%"></i></div>`).join('');
 openModal(`第${lv.id}关 · ${lv.name}`,`<div class="mut" style="margin-bottom:6px">${lv.desc}</div>${rows}
  <div class="hr"></div><div class="kv"><span>剩余时间</span><b>${Math.max(0,lv.days-G.day+1)} 天</b></div>`,
  [{t:'继续经营',cls:'gold'}]);
}

/* ============================================================
   暂停 / 速度 / 声音
============================================================ */
function togglePause(force){
 if(!G.running)return;
 G.paused=force===undefined?!G.paused:force;
 $('#btnPause').textContent=G.paused?'▶':'⏸';
 if(G.paused){
  openModal('暂停中',`
   <div class="center mut">汤屋的时光静止了……</div>
   <div class="hr"></div>
   <div class="kv"><span>经营天数</span><b>第 ${G.day} 天</b></div>
   <div class="kv"><span>累计客人</span><b>${Object.values(G.dex).reduce((a,b)=>a+b,0)} 位</b></div>
   <div class="kv"><span>当前声望</span><b>${Math.round(G.rep)}（${storeStars()} 星）</b></div>`,
   [{t:'排版模式',cls:'',fn:()=>{closeModal();toggleEdit(true);}},
    {t:'回到主页',cls:'rose',fn:()=>{saveGame();closeModal();G.running=false;showIntro();}},
    {t:'继续',cls:'gold',fn:()=>{togglePause(false);}}]);
 }else closeModal();
}
$('#btnPause').onclick=()=>{SFX.click();togglePause();};
$('#btnSpeed').onclick=()=>{G.speed=G.speed===1?2:1;$('#btnSpeed').textContent='×'+G.speed;SFX.click();};
$('#btnSound').onclick=()=>{SND.on=!SND.on;$('#btnSound').style.opacity=SND.on?1:.4;if(SND.on){sndInit();SFX.click();}};

/* ============================================================
   存档
============================================================ */
const SAVEKEY='mistvale-tangwu-v1';
/* 存档诊断：失败时输出可读日志，关键写入失败同时提示玩家 */
function saveErr(tag,e){console.error('[存档] '+tag+'失败:',e);}
function saveGame(){
 if(G.mode!=='free'||!G.running)return;
 try{
  const rooms={};
  for(const rid in G.rooms){const r=G.rooms[rid];rooms[rid]={unlocked:r.unlocked,placed:r.placed.map(p=>({id:p.id,x:p.x,y:p.y,level:p.level}))};}
  localStorage.setItem(SAVEKEY,JSON.stringify({v:GAME_VERSION,coins:G.coins,gems:G.gems,rep:G.rep,day:G.day,hour:G.hour,
   dex:G.dex,stats:G.stats,staff:G.staff,dexRewarded:G.dexRewarded,levelDone:G.levelDone,rooms}));
 }catch(e){saveErr('保存进度',e);toast('存档保存失败','#ff8ba7');}
}
function hasSave(){try{return!!localStorage.getItem(SAVEKEY);}catch(e){return false;}}
function loadGame(){
 try{
  const d=JSON.parse(localStorage.getItem(SAVEKEY));if(!d)return false;
  resetState();
  G.coins=d.coins;G.gems=d.gems;G.rep=d.rep;G.day=d.day||1;G.hour=d.hour||6.2;
  G.dex=d.dex||{};G.stats=d.stats||G.stats;G.staff=d.staff||{};
  G.dexRewarded=!!d.dexRewarded;G.levelDone=d.levelDone||{};
  for(const rid in d.rooms){
   if(!G.rooms[rid])continue;
   G.rooms[rid].unlocked=d.rooms[rid].unlocked;
   G.rooms[rid].placed=d.rooms[rid].placed.map(p=>{
    const f=FACILITIES[p.id];
    const x=f?clamp(p.x,0,GW-f.w):p.x;
    const y=f?clamp(p.y,f.wallOnly?1:WALL_H,GH-f.h):p.y;
    return{uid:'p'+(++G.uidc),id:p.id,x,y,level:p.level||1,daily:0};
   });
  }
  return true;
 }catch(e){saveErr('读取进度',e);return false;}
}
function resetState(){
 G.mode='free';G.running=false;G.paused=false;G.speed=1;$('#btnSpeed').textContent='×1';$('#btnPause').textContent='⏸';
 G.t=0;G.day=1;G.hour=6.2;G.period=periodAt(6.2);
 G.coins=200;G.gems=0;G.rep=18;G.dayCoins=0;G.nightCoins=0;
 G.guests=[];G.nextGuestId=1;G.spawnT=2.5;
 G.dex={};G.stats={guests:0,wish:0,goodrev:0,reviews:0,tips:0};
 G.weather='sun';G.weatherT=30;G.staff={};G.clean=90;
 G.level=null;G.levelProg={guests:0,wish:0,goodrev:0,nightcoin:0};
 G.levelDone=G.levelDone||{};G.dexRewarded=false;G.casesDone={};
 G.intel={topic:null,t:0};G.fresh={};G.over=false;G.actors=[];G.dragHinted=false;
 initRooms();nightA=0;clearParticles();
}

/* ============================================================
   开局 / 初始布局
============================================================ */
function starterLayout(){
 const put=(rid,id,x,y,lv=1)=>G.rooms[rid].placed.push({uid:'p'+(++G.uidc),id,x,y,level:lv,daily:0});
 put('hall','hot',4,6);put('hall','vender',13,4);put('hall','bench',12,11);put('hall','lantern',3,1);put('hall','plant',20,5);
 put('hall','tea',17,10);put('hall','bucket',9,5);put('hall','lantern',26,1);
}
function startFree(fresh){
 sndInit();
 if(fresh||!loadGame()){resetState();starterLayout();}
 spawnActors();
 G.mode='free';G.running=true;G.paused=false;
 $('#intro').classList.add('off');
 renderRoomTabs();paintWeatherIcon();
 banner('雾隐汤屋 · 开张大吉','点击客人闲聊 · 点击汤池升级');
 saveGame();
}
function showIntro(){
 $('#intro').classList.remove('off');
 $('#btnFree').textContent=hasSave()?'继续经营':'自由经营';
}

/* ============================================================
   布局编辑器（拖拽 HUD 控件）
============================================================ */
const LAYOUTKEY='mistvale-layout-v1';
let editState=null;
function toggleEdit(on){
 document.body.classList.toggle('editing',on);
 G.editLayout=on;
 if(on)toast('拖动顶栏控件调整位置','#ffd45e');
 else saveLayout();
}
function saveLayout(){
 const data={};
 document.querySelectorAll('#topbar .chip.drag').forEach(c=>{
  data[c.id]={dx:parseFloat(c.dataset.dx||0),dy:parseFloat(c.dataset.dy||0)};
 });
 try{localStorage.setItem(LAYOUTKEY,JSON.stringify(data));toast('排版已保存','#5ad0a6');}catch(e){saveErr('保存排版',e);toast('排版保存失败','#ff8ba7');}
}
function loadLayout(){
 try{
  const d=JSON.parse(localStorage.getItem(LAYOUTKEY));if(!d)return;
  for(const id in d){const c=document.getElementById(id);if(c){c.dataset.dx=d[id].dx;c.dataset.dy=d[id].dy;c.style.transform=`translate(${d[id].dx}px,${d[id].dy}px)`;}}
 }catch(e){saveErr('读取排版',e);}
}
document.querySelectorAll('#topbar .chip.drag').forEach(c=>{
 c.addEventListener('pointerdown',e=>{
  if(!G.editLayout)return;
  e.preventDefault();
  const sx=e.clientX,sy=e.clientY,ox=parseFloat(c.dataset.dx||0),oy=parseFloat(c.dataset.dy||0);
  const move=ev=>{
   // 竖屏旋转时的坐标逆变换
   let ddx=ev.clientX-sx,ddy=ev.clientY-sy;
   if(ROTATED){ddx=ev.clientY-sy;ddy=-(ev.clientX-sx);}
   c.dataset.dx=ox+ddx;c.dataset.dy=oy+ddy;
   c.style.transform=`translate(${ox+ddx}px,${oy+ddy}px)`;};
  const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);};
  window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
 });
});
$('#btnEditSave').onclick=()=>saveLayout();
$('#btnEditReset').onclick=()=>{document.querySelectorAll('#topbar .chip.drag').forEach(c=>{c.dataset.dx=0;c.dataset.dy=0;c.style.transform='';});toast('已重置','#ffb45e');};
$('#btnEditExport').onclick=()=>{
 const data=localStorage.getItem(LAYOUTKEY)||'{}';
 try{navigator.clipboard.writeText(data);toast('排版 JSON 已复制','#5ad0a6');}
 catch(e){prompt('复制以下排版数据：',data);}
};
$('#btnEditDone').onclick=()=>toggleEdit(false);

/* ============================================================
   PWA：manifest 动态生成 + Service Worker 升级提示
============================================================ */
function setupPWA(){
 try{
  const link=document.createElement('link');link.rel='manifest';link.href='./manifest.webmanifest';
  document.head.appendChild(link);
 }catch(e){saveErr('生成 PWA manifest',e);}
 if('serviceWorker'in navigator&&(location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname))){
  navigator.serviceWorker.register('sw.js').then(reg=>{
   reg.addEventListener('updatefound',()=>{
    const nw=reg.installing;if(!nw)return;
    nw.addEventListener('statechange',()=>{
     if(nw.state==='installed'&&navigator.serviceWorker.controller){
      banner('新版本已就绪','点击任意处刷新');
      $('#banner').style.pointerEvents='auto';$('#banner').onclick=()=>location.reload();
     }
    });
   });
  }).catch(()=>{});
 }
}

/* ============================================================
   开场画面 & 启动
============================================================ */
function paintIntro(){
 // 星空
 const intro=$('#intro');
 for(let i=0;i<46;i++){
  const s=el('div','star-dot');
  s.style.left=rnd(100)+'%';s.style.top=rnd(100)+'%';s.style.animationDelay=rnd(2.4)+'s';
  intro.appendChild(s);
 }
 // 小 Logo：汤池 + 水豚
 const c=$('#introLogo'),g=c.getContext('2d');g.imageSmoothingEnabled=false;
 const u=4;const R=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x*u,y*u,w*u,h*u);};
 R(1,9,16,4,'#5a5a66');R(2,8,14,1,'#9a9aa8');R(3,9,12,3,'#7fd4b8');R(3,9,12,1,'#b8ecd8');
 R(6,5,6,5,'#b07a3e');R(5,4,2,2,'#b07a3e');R(11,4,2,2,'#b07a3e');R(7,6,1,1,'#221610');R(10,6,1,1,'#221610');
 R(7,9,4,2,'#e2c290');
 g.fillStyle='#ffffff';for(let i=0;i<4;i++){g.fillRect((3+i*4)*u,(6-(i%2))*u,1*u,1*u);g.fillRect((4+i*4)*u,(4-(i%2))*u,1*u,1*u);}
}
function bindUI(){
 $('#btnBuild').onclick=()=>{SFX.click();openBuild();};
 $('#btnStaff').onclick=()=>{SFX.click();openStaff();};
 $('#btnDex').onclick=()=>{SFX.click();openDex();};
 $('#btnLevel').onclick=()=>{SFX.click();if(G.level)showLevelProg();else openLevels();};
 $('#btnFree').onclick=()=>{SFX.click();startFree(false);};
 $('#btnStage').onclick=()=>{SFX.click();openLevels();};
 // 开场按钮下的新档入口
 const rs=el('button','pbtn mini ghost','重置存档');
 rs.style.marginTop='4px';
 rs.onclick=()=>{try{localStorage.removeItem(SAVEKEY);}catch(e){saveErr('重置存档',e);}toast('存档已重置','#ffb45e');$('#btnFree').textContent='自由经营';};
 $('#introBtns').appendChild(rs);
 document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.running&&!G.paused)togglePause(true);});
}
/* boot */
if(location.hash==='#autostart'){setTimeout(()=>{startFree(true);},400);}
try{const lv=JSON.parse(localStorage.getItem(SAVEKEY+'.levels'));if(lv)G.levelDone=lv;}catch(e){saveErr('读取关卡进度',e);}
paintIcon($('#coinCv'),iconCoin);paintIcon($('#gemCv'),iconGem);
initRooms();resetState();bindUI();paintIntro();loadLayout();setupPWA();
renderRoomTabs();paintWeatherIcon();fit();showIntro();
</script>
